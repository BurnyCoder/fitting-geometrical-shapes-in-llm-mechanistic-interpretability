  - id: cnn_filter_circle
    shape: circle of rotating edge filters
    vocab_class: arc
    concept: first-layer convolution filters
    models: CNNs on MNIST, CIFAR-10, SVHN, ImageNet
    method: topological data analysis
    top3_pca: "n/a"
    citation: "Bruel Gabrielsson & Carlsson 2018, Exposition and Interpretation of the Topology of Neural Networks"
    url: https://arxiv.org/abs/1810.03234
    bibkey: bruel2018topology
    verified: "abstract ('a simple circle consisting of rotating edges' in conv layers)"
  - id: gru_onion
    shape: nested "onion" shells (magnitude-coded position)
    vocab_class: out-of-vocab
    concept: sequence position
    models: gated RNNs (GRUs)
    method: interventions
    top3_pca: "no"
    citation: "Csordas et al. 2024, Recurrent Neural Networks Learn to Store and Generate Sequences using Non-Linear Representations (BlackboxNLP 2024)"
    url: https://arxiv.org/abs/2408.10920
    bibkey: csordas2024onion
    verified: fulltext
# Known confounder (not a shape claim): the PCA "horseshoe"/"arch"/ringing artifact. When the similarity of
# the points decays smoothly with an ordinal or latent variable (distance-decaying covariance: Novembre &
# Stephens 2008; local distances only: Diaconis et al. 2008; random walks: Antognini & Sohl-Dickstein 2018;
# autocorrelated, shifted signals: Shinn 2023), the top PCs are close to cos(k*pi*s): an arch in PC1-2 and a
# Lissajous/helix-like curve in PC1-3, even if the representation is not "curved" in any meaningful sense.
confounders:
  - id: pca_horseshoe
    shape: ringing curve c + sum_k a_k cos(k*pi*s) e_k
    vocab_class: ringing
    citation: "Novembre & Stephens 2008 (Nature Genetics); Diaconis, Goel & Holmes 2008; Antognini & Sohl-Dickstein 2018; Shinn 2023 (PNAS)"
    bibkey: novembre2008horseshoe,diaconis2008horseshoes,antognini2018walks,shinn2023phantom
    url: https://doi.org/10.1038/ng.139
    url2: https://arxiv.org/abs/0811.1477
    url3: https://arxiv.org/abs/1806.08805
    url4: https://doi.org/10.1073/pnas.2311420120
