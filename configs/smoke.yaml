# Smoke test: the whole pipeline end to end in a few minutes (used by tests and CI-like checks).
run_name: smoke
train:
  steps: 300
  batch_size: 64
  warmup_steps: 50
  log_every: 50
  val_every: 150
  val_size: 256
  ckpt_every: 300
  max_minutes: 5
eval:
  test_per_cell: 2
  bootstrap_reps: 100
  real_subsample_reps: 5
  classical_restarts: 2
  classical_steps: 50
infer:
  refine_steps: 30
