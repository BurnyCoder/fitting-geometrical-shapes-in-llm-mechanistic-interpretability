# Smoke test: the whole pipeline end to end in a few minutes (used by tests and CI-like checks).
run_name: smoke
train:
  steps: 300
  batch_size: 64
  token_budget: 32768
  gen_chunk: 2
  warmup_steps: 50
  log_every: 50
  val_every: 150
  val_size: 256
  ckpt_every: 300
  max_minutes: 5
eval:
  test_per_cell: 2
  bootstrap_reps: 100
  real_subsample_reps: 5
  classical_restarts: 2
  classical_steps: 50
  baseline_per_cell: 1
  val_per_cell: 2
  gbm_per_family: 20
infer:
  refine_steps: 30
